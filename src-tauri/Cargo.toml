[build-dependencies]

[build-dependencies.tauri-build]
version = "2"
features = []

[dependencies]

[dependencies.tauri]
version = "2"
# unstable: multiwebview（视频页签子 WebView / setBounds / set_visible）
# devtools: 调试器（联调驱动 CDP 依赖 remote-debugging-port，devtools 便于排查）
# image-ico: 解码 icons/icon.ico（主窗口图标，任务栏清晰显示）
features = ["unstable", "devtools", "image-ico"]

[dependencies.tauri-plugin-single-instance]
version = "2"

[dependencies.tauri-plugin-clipboard-manager]
version = "2"

[dependencies.serde]
version = "1"
features = ["derive"]

[dependencies.serde_json]
version = "1"

# Windows API 直调（toast 小窗 owner 父子关系；版本对齐依赖树既有 windows-sys）
[dependencies.windows-sys]
version = "0.60"
features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"]

# 系统文件选择框（打开本地视频）
[dependencies.rfd]
version = "0.15"

# 注：WGC 抓屏 / H.264 编码 / WebRTC 推流链路已删除（改用"无损文件流 + 原画直链共享"），
# 不再依赖 windows / openh264 / webrtc / tokio / bytes。

[package]
name = "watchsync"
version = "0.6.0"
edition = "2021"

[profile.dev]
incremental = true

# 本 crate 在 dev 下也开优化（纯 Rust 媒体/协议逻辑；依赖仍按默认编译）
[profile.dev.package.watchsync]
opt-level = 3

[profile.release]
strip = true
lto = true
codegen-units = 1
